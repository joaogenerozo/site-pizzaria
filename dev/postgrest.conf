# PostgREST local que imita a API REST do Supabase (só para desenvolvimento/testes)
# Postgres local padrão (localhost:5432). Se o seu usar outra porta ou servidor, ajuste esta linha.
db-uri = "postgres://authenticator:senha-local-authenticator@localhost:5432/dev"
db-schemas = "public"
db-anon-role = "anon"
jwt-secret = "local-dev-secret-only-for-tests-0123456789abcdef"
server-port = 54330
